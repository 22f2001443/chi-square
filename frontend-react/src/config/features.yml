# Feature flags. Set one to false to switch that part of the site off without
# deleting it; anything not listed here stays on.

# Pages, by address. A page that's off drops out of the navbar, footer and
# buttons, and its address shows the "being built" notice instead.
pages:
  /events/upcomings: true
  /events: true
  /people: true
  /abouts: true
  /resources/course-materials: false
  /resources/books: false
  /resources/research-papers: false
  /blogs: false

# Home page sections.
home:
  latest: true
  formats: true
  partners: true
  join: true

# People page sections, named as in people.yml.
people:
  coreTeam: true
  collaborators: false
  volunteers: true
  pastMembers: true
  pastCollaborators: true
  join: true
