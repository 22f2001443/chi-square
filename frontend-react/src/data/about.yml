# About Us page.

title: club's message

mission:
  title: Our Mission
  body: >-
    Welcome to the Chi-Square Statistics Club. Our mission is to cultivate
    statistical curiosity and empower students through data-driven initiatives,
    academic discussions, and collaborative events. Whether you're new to
    statistics or already immersed in it, our society welcomes you to grow,
    connect, and contribute.

approach:
  title: How We Do?
  body: >-
    We host academic events, revision bootcamps, research talks, and workshops.
    We create opportunities for students to explore statistics beyond
    classrooms and connect with industry and academic mentors.

structure:
  title: SOCIETY'S STRUCTURE
  intro: >-
    The Chi-Square Statistics Club at IIT Madras BS is organized to promote
    collaborative learning, academic curiosity, and peer mentoring through a
    well-defined team structure.
  points:
    - label: Leadership
      text: The club is led by student officers who manage operations, strategy, and event planning across all academic terms.
    - label: Group Structure
      text: We operate through dedicated teams, each responsible for specific verticals such as content, research, and outreach.
    - label: Membership
      text: Open to all enrolled BS students, encouraging participation through events and projects.
    - label: Faculty Involvement
      text: While student-driven, we benefit from faculty guidance on vision and knowledge direction.
  teamsLabel: Our Teams
  teams:
    - name: Content & Research Team
      text: Crafts event materials and research briefs.
    - name: PN & Social Media Team
      text: Manages outreach, branding, and engagement.
    - name: Design & Web Team
      text: Maintains the website and visual identity of the club.

benefits:
  title: BENEFITS OF JOINING US
  body: >-
    Becoming a member of the Chi-Square Statistics Club offers you hands-on
    exposure to the world of data, research, and analytical thinking. You'll
    gain experience by participating in revision sessions, academic talks, and
    collaborative projects. Network with peers and mentors, enhance your
    academic profile, and build a foundation for a future in data science,
    statistics, or research. Whether you're exploring or already passionate
    about statistics, our club is the perfect platform to learn and grow.
  actions:
    - label: Become a Member
      href: /membership-form
      style: primary
    - label: Join Our Core Team
      href: /core-team-application
      style: secondary

testimonials:
  title: TESTIMONIALS
  items:
    - quote: Joining Chi-Square helped me find direction in the field of statistics and gave me the opportunity to work on real projects.
      author: Aditi, BSc Statistics Student
    - quote: Being part of the core team improved my leadership skills and helped me connect with like-minded peers.
      author: Ravi, Core Team Member
