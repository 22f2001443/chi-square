# About Us page.

hero:
  eyebrow: About us
  title: A statistics community for the IIT Madras BS Degree
  lede: >-
    Whether you're new to statistics or already immersed in it, the
    %SITE_NAME% welcomes you to grow, connect, and contribute.

mission:
  label: Our mission
  body: >-
    To cultivate statistical curiosity and empower students through
    data-driven initiatives, academic discussions, and collaborative events.

approach:
  label: How we work
  body: >-
    We host academic events, revision bootcamps, research talks, and
    workshops, and connect students with industry and academic mentors
    beyond the classroom.

structure:
  eyebrow: Structure
  title: How we're organised
  intro: >-
    The %SITE_NAME% promotes collaborative learning, academic curiosity, and
    peer mentoring through a well-defined team structure.
  points:
    - label: Leadership
      text: Student officers manage operations, strategy, and event planning across all academic terms.
    - label: Group structure
      text: Dedicated teams own specific verticals such as content, research, and outreach.
    - label: Membership
      text: Open to all enrolled BS students, with participation through events and projects.
    - label: Faculty involvement
      text: Student-driven, with faculty guidance on vision and knowledge direction.
  teamsTitle: Our teams
  # `code` is the short label in each team's badge.
  teams:
    - code: CR
      name: Content & Research
      text: Crafts event materials and research briefs.
    - code: PR
      name: PR & Social Media
      text: Manages outreach, branding, and engagement.
    - code: DW
      name: Design & Web
      text: Maintains the website and visual identity.

benefits:
  eyebrow: Why join
  title: Benefits of joining us
  body: >-
    Get hands-on exposure to the world of data, research, and analytical
    thinking. Take part in revision sessions, academic talks, and
    collaborative projects; network with peers and mentors; strengthen your
    academic profile; and build a foundation for a future in data science,
    statistics, or research.
  actions:
    - label: Become a member
      href: /membership-form
      style: primary
    - label: Join our core team
      href: /core-team-application
      style: secondary

testimonials:
  title: In their words
  items:
    - quote: Joining Chi-Square helped me find direction in the field of statistics and gave me the opportunity to work on real projects.
      author: Aditi, BSc Statistics Student
    - quote: Being part of the core team improved my leadership skills and helped me connect with like-minded peers.
      author: Ravi, Core Team Member
