# Our Journey: every past event, shown newest first on a timeline grouped by
# term.
#
# Per event: `type` must match a `type` under `kinds`; `series` is a code
# from series.yml; `collaboration` is matched against the collaborators in
# site.yml to show their logo. Attendance is `participants` (a count) or
# `registered` / `attended`. Links are optional and only shown when present
# (youtube, material, linkedin, instagram). `poster` (relative to public/) is
# shown on the Home page's latest-event cards.

page:
  title: Every session we've run, one scroll at a time
  lede: >-
    Every talk, revision session, workshop and contest we've run since our
    inauguration in November 2023, newest first.
  scrollHint: Scroll to travel back in time
  upNext: "Up next: see upcoming events"
  beginning:
    title: Where it all began
    text: >-
      November 2023, Nilgiri House. One online session on discrete probability
      distributions, and a club that has kept growing every term since.

# Kinds of event, in filter order. `color` marks the event on the timeline.
kinds:
  - type: Academic Talks
    label: Academic talk
    plural: Academic talks
    color: "#2F4BD8"
  - type: Revision Session
    label: Revision session
    plural: Revision sessions
    color: "#0E8FA8"
  - type: Bootcamp / Workshops
    label: Workshop
    plural: Workshops
    color: "#8A3FD1"
  - type: Contests
    label: Contest
    plural: Contests
    color: "#D9730D"

