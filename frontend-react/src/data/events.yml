# Past events, grouped into sections on the Events page.
#
# Each section lists the events whose `type` matches its `type`, using one of
# two layouts:
#   feature: wide card with poster, details, hosts and link icons
#   card:    compact grid card (YouTube/material links appear on hover)
#
# Image paths are relative to `public/`. Links are optional; only the ones
# present are shown (youtube, linkedin, material, instagram).

sections:
  - title: Workshops/BootCamps
    type: Bootcamp / Workshops
    layout: feature
    logos: [logo_t.png, nil.png]
  - title: Academic Talks
    type: Academic Talks
    layout: feature
    logos: [logo_t.png, nil.png]
  - title: Revision Sessions
    type: Revision Session
    layout: card
    logos: [logo_t.png, nil.png]
  - title: competitions
    type: Contests
    layout: card
    logos: [logo_t.png]

