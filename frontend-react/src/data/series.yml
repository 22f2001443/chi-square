# Shared series definitions for events.yml and upcoming.yml.
# - Each key is a stable series code referenced by `series: <code>`.
# - `name` and `topic` describe the series on event cards.
# - Optional `group` combines series into one dropdown option within a format.
#   Use exactly the same group text for every series that belongs together.
# Individual dates, speakers, posters and unique event IDs belong on events.

