# People page. Photo paths are relative to `public/`.
# Never add email addresses, phone numbers or roll numbers here: everything in
# this file ships in the site's JavaScript, even fields the page doesn't show.
#
# Every field is optional: leave out `role`, `photo`, `linkedin`, `tenure`,
# etc. and that part of the card is simply not shown. A section with no
# members (or left out entirely) is hidden. `team` and `house` come from the
# member roster and aren't displayed.

