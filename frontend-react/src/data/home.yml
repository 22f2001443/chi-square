# Home page. Image paths are relative to `public/`.

hero:
  image: flyer.png
  alt: "%SITE_NAME% flyer"

# A line break in `label` ("\n") is kept when displayed.
stats:
  - value: "2+"
    label: Years
  - value: "380+"
    label: Members
  - value: "15+"
    label: "Academic\nEvents"
  - value: "400+"
    label: "Active\nParticipants"

announcements:
