# Site-wide settings: name, logo, footer, social links and collaborators.
#
# Image paths are relative to `public/`. Links starting with `/` are pages on
# this site (e.g. /people); full URLs open in a new tab.

# The site's name. Write %SITE_NAME% in any other data file to insert it
# (quote the value if it starts with %SITE_NAME%).
name: "Chi-Square: Statistics Interest Group"
# The two halves of the name, shown stacked in the navigation bar and hero.
shortName: Chi-Square
tagline: Statistics Interest Group
# Used for search engines and link previews.
description: >-
  Chi-Square is the statistics interest group of the IIT Madras BS Degree:
  academic talks, revision sessions, workshops and contests for students.
logo: logo_t.png
favicon: logo_t.png

footer:
  institution: BS Degree, Indian Institute of Technology Madras
  location: Chennai, Tamil Nadu
  # Shown with its logo under the address; `logo` is optional.
  programme:
    name: IIT Madras BS Degree
    logo: IIT_Madras_Logo.png
    href: https://study.iitm.ac.in/ds/
  linkGroups:
    - title: Quick links
      links:
        - label: IIT Madras BS Degree
          href: https://study.iitm.ac.in/ds/
        - label: Nilgiri House
          href: https://sites.google.com/ds.study.iitm.ac.in/nilgirihouse
        - label: RaSoR Society
          href: https://rasoriitm.vercel.app/
    - title: Club
      links:
        - label: About us
          href: /abouts
        - label: People
          href: /people
        - label: Our Journey
          href: /events
    - title: Resources
      links:
        - label: Course materials
          href: /resources/course-materials
        - label: Blogs
          href: /blogs
        - label: Research papers
          href: /resources/research-papers

socials:
  - label: LinkedIn
    href: https://www.linkedin.com/company/chi-square-statistics-club/
  - label: Instagram
    href: https://www.instagram.com/chisquare_iitmbs/
  - label: YouTube
    href: https://www.youtube.com/watch?v=lTGWGsamhxg&list=PLdPxneWYhyUP2lsZWjhkRYM8KB_Rg8wln
  - label: GitHub
    href: https://github.com/22f2001443/chi-square

# Partners. An event's `collaboration` in events.yml is matched against
# `name` here to show the logo on its card; `logo` is optional.
collaborators:
  - name: Nilgiri House
    logo: nil.png
    href: https://sites.google.com/ds.study.iitm.ac.in/nilgirihouse
  - name: RaSoR Society
    href: https://rasoriitm.vercel.app/

maintenance:
  title: This page is being built
  message: We're putting this section together. Check back soon.

notFound:
  title: Page not found
  message: The page you're looking for doesn't exist or has moved.
